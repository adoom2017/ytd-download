name: Build desktop test packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：发布版本标签，例如 v0.1.0；留空则只生成 Actions 构建产物"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: streamnest-windows-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: streamnest-macos-intel
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: streamnest-macos-apple-silicon
    runs-on: ${{ matrix.os }}
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      # Tauri validates every configured external binary while compiling the
      # generated context, including during `cargo test`. A fresh runner does
      # not have these gitignored files until this step has completed.
      - name: Prepare verified sidecars
        run: pnpm sidecars

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build desktop package
        run: pnpm tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
            src-tauri/THIRD_PARTY_NOTICES.md

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Validate and publish release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected v1.2.3 or v1.2.3-beta.1)" >&2
            exit 1
          fi

          shopt -s globstar nullglob
          windows_packages=(release-artifacts/**/*.exe)
          macos_packages=(release-artifacts/**/*.dmg)

          if (( ${#windows_packages[@]} < 1 || ${#macos_packages[@]} < 2 )); then
            echo "Expected at least one Windows installer and two macOS DMGs." >&2
            find release-artifacts -type f -print
            exit 1
          fi

          packages=("${windows_packages[@]}" "${macos_packages[@]}")
          release_options=(--generate-notes --latest --title "Streamnest $RELEASE_TAG")

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_options+=(--verify-tag)
          else
            release_options+=(--target "$GITHUB_SHA")
          fi

          gh release create "$RELEASE_TAG" \
            "${packages[@]}" \
            src-tauri/THIRD_PARTY_NOTICES.md \
            "${release_options[@]}"
