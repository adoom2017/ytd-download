[package]
name = "streamnest"
version = "0.1.0"
description = "A private, cross-platform video download manager"
authors = ["Streamnest contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "streamnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
thiserror = "2"
regex = "1"
once_cell = "1"
dirs = "6"
rfd = "0.15"
open = "5"
url = "2"

[dev-dependencies]
tempfile = "3"
